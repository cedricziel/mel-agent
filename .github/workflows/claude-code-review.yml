name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Required to post the review comment
      issues: write # Required for track_progress comment updates
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Posts findings as a PR comment and keeps it updated as Claude works.
          # Without this, automation-mode output only lands in the run log.
          # Supported for pull_request opened/synchronize/ready_for_review/reopened.
          track_progress: true

          prompt: |
            Review this pull request and provide feedback on:
            - Code quality, and adherence to the conventions in CLAUDE.md
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and specific, and skip praise-only comments.

          # No --model is set on purpose: the action tracks the current default
          # model. Pinning one is what broke this workflow before, when the
          # pinned model was retired and every run failed with a 404.
          claude_args: |
            --max-turns 15
